# Die Host-Ports sind über eine `.env` im Projektverzeichnis einstellbar,
# damit dieselbe Datei für Produktion (3000/5432) und Testinstanz (3001/5433)
# taugt. Compose liest diese Variablen aus `.env`, NICHT aus `env_file`.
services:
  app:
    build:
      context: .
      network: host
      args:
        DATABASE_URL: ${DATABASE_URL_BUILD}
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - uploads:/app/uploads
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sensei
      POSTGRES_USER: sensei
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sensei -d sensei"]
      interval: 5s
      timeout: 3s
      retries: 5

secrets:
  db_password:
    file: ./db_password.txt

volumes:
  pgdata:
  uploads:
